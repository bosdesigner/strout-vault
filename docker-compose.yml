# Local Postgres 17 with pgvector for development and tests. Optional: `npm run db:local`
# finds a Postgres on 127.0.0.1:54329 (this one, or the cluster it manages under .data/pg)
# and applies db/migrations + db/seed.sql to it. Never points at Neon.
#
#   docker compose up -d
#   npm run db:local
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: strout-vault-pg
    ports:
      - "54329:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - strout-vault-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  strout-vault-pg:
