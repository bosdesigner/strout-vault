# Where texts and email go, beyond what the vault already knows.
#
# A new thread is filed under the one workspace its participants map to. Each matched person
# contributes the rule below if there is one, otherwise every workspace they have a role in
# (People page), directly, through the company they work for, or on a project. Email addresses
# that contribute nothing fall back to the domain rules. Exactly one workspace wins; anything
# else (none, several, or phalanx) goes to `inbox` with a review item. phalanx is never
# assigned automatically, even from a rule here. `personal` and `inbox` are never visible to a
# "*" token; name them on a token explicitly.
#
# Edit and save; the server and worker read this file on every import. Party ids are on each
# person's page (the URL /people/<id>).

# parties:
#   42: personal          # Mom
#   57: personal          # Sarah (sister)
#   2: another_story      # Kevin McGuire: texts are always Another Story, whatever else he does

# domains:
#   oakridgebuilders.example.com: strout_arch
#   gulfcoastmillwork.example.com: southern_shutter

# Apple Notes sent by the Mac media collector (docs/INGEST.md): folder name -> workspace.
# Call recordings and voice memos route by who is on them (the parties rules above); a note has
# nobody on it, so its folder is the only signal. Unmatched notes go to `inbox`. phalanx is never
# assigned from here either: a note in a phalanx folder goes to `inbox` with phalanx suggested.
# apple_notes_folders:
#   Another Story: another_story
#   Strout Architecture: strout_arch
#   Family: personal

# TikTok and Instagram DMs whose sender is nobody the vault knows yet: the workspace to file them
# under instead of `inbox`. A sender who is known (matched by handle on the People page) always
# decides first, and phalanx is never taken from here. Leave a source out to keep its unknown
# senders in `inbox` until you approve them as people.
# dm_sources:
#   tiktok: another_story
#   instagram: another_story
