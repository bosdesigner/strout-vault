<!doctype html>
<!-- A stand-in for TikTok's web inbox (www.tiktok.com/messages), shaped like its markup: data-e2e
     attributes on list rows, chat items and the header, styled-component class names elsewhere.
     Synthetic people and text only. -->
<html><body><main>
  <div class="css-1 DivConversationListContainer">
    <div data-e2e="chat-list-item" class="css-2 DivItemWrapper">
      <img src="https://p16-sign.tiktokcdn-us.com/avatar/mike.jpeg?x=1" width="56" />
      <div class="css-3 DivInfoContainer"><p class="css-4 PInfoNickname">🔥Mike Builds🔥</p><p class="css-5 PInfoExtract">See you Thursday.</p><span class="css-6 SpanInfoTime">2h</span></div>
      <span class="css-7 SpanUnreadBadge">1</span>
    </div>
    <div data-e2e="chat-list-item" class="css-2 DivItemWrapper">
      <img src="https://p16-sign.tiktokcdn-us.com/avatar/pegus.jpeg" width="56" />
      <div class="css-3 DivInfoContainer"><p class="css-4 PInfoNickname">Pegus Heard</p><p class="css-5 PInfoExtract">Can you add a second story?</p><span class="css-6 SpanInfoTime">Yesterday</span></div>
    </div>
  </div>
  <div class="css-8 DivChatBox">
    <div class="css-9 DivChatHeader">
      <a href="/@mikebuilds" data-e2e="chat-uniqueid">@mikebuilds</a>
      <p data-e2e="chat-nickname">🔥Mike Builds🔥</p>
    </div>
    <div class="css-10 DivChatMainContent">
      <div class="css-11 DivTimeContainer">10/26/2026 10:00 AM</div>
      <div data-e2e="chat-item" class="css-12 DivChatItemWrapper">
        <a href="/@mikebuilds"><img src="/avatar/mike.jpeg" width="32" /></a>
        <div class="css-13 DivMessageContainer"><p class="css-14 PText">Saw the Build Up video. Is Huntsville open?</p></div>
      </div>
      <div data-e2e="chat-item" class="css-12 DivChatItemWrapper">
        <div class="css-13 DivMessageContainer"><p class="css-14 PText">It is. Grab a time on my calendar.</p></div>
        <a href="/@hemakesbigmoves"><img src="/avatar/ben.jpeg" width="32" /></a>
      </div>
      <div class="css-11 DivTimeContainer">Today 8:00 AM</div>
      <div data-e2e="chat-item" class="css-12 DivChatItemWrapper">
        <a href="/@mikebuilds"><img src="/avatar/mike.jpeg" width="32" /></a>
        <div class="css-13 DivVideoContainer"><a href="/@someoneelse/video/7400000000000000001"><img src="/cover.jpeg" width="120" /></a></div>
      </div>
      <div data-e2e="chat-item" class="css-12 DivChatItemWrapper">
        <a href="/@mikebuilds"><img src="/avatar/mike.jpeg" width="32" /></a>
        <div class="css-13 DivMessageContainer"><p class="css-14 PText">Booked for Thursday.</p></div>
      </div>
    </div>
  </div>
</main></body></html>
